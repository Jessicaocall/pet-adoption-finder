<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    {% if title %}
    <title>{{ title }} - Pet Adoption Finder</title>
    {% else %}
    <title>Welcome to Pet Adoption Finder!</title>
    {% endif %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <a class="logo" href="{{ url_for('index') }}">🐾 Pet Adoption Finder</a>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('animals') }}">Browse Pets</a>
            <a href="{{ url_for('about') }}">About Us</a>
            <a href="{{ url_for('login') }}">Login</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>Pet Adoption Finder · Cork, Ireland · © 2026</footer>
</body>
</html>
